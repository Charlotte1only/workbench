      dp.items.push(Item.make('拉臭情况',{owner:'tiaotiao',times:[]},{sourceDate:today,periodKey:today,order:dp.items.reduce((m,x)=>Math.max(m,x.order||0),0)+100,carryPolicy:'keep'}));
    }
    ['benben','tiaotiao'].forEach(owner=>{
      (d.templates[owner]||[]).forEach(t=>{
        if(!Item.visible(t)||carried.has(t.text)) return;
        if(dp.items.some(i=>Item.visible(i)&&i.text===t.text&&i.fields&&i.fields.owner===owner)) return;
        if(dp.items.some(i=>Item.visible(i)&&i.tplId===t.id)) return;
        const nt=Item.make(t.text,{owner:owner},{sourceDate:today,periodKey:today,order:dp.items.reduce((m,x)=>Math.max(m,x.order||0),0)+100,carryPolicy:'carry'});
        nt.tplId=t.id; nt.tplOwner=owner;
        dp.items.push(nt);
      });
    });
  },
  _p(d,scope,date){
    if(!d.byDate[date]) d.byDate[date]=Migrate.emptyDay();
    let node=d.byDate[date];
    const keys=scope.split('.');
    keys.forEach((k,i)=>{
      if(!node[k]) node[k]={};
      if(i===keys.length-1) node[k].items=node[k].items||[];
      node=node[k];
    });
    return node;
  }
};

const Stats = {
  drinkByMonth(month){
    const map={};
    Store.allItems('bodyMind.drink').forEach(it=>{
      if(String(it.sourceDate).slice(0,7)!==month) return;
      const cat=it.fields.category||'未分类';
      map[cat]=(map[cat]||0)+1;
    });
    return map;
  },
  sleepByMonth(month){
    const seen=new Set(), out=[];
    Store.allItems('bodyMind.sleep').forEach(it=>{
      if(String(it.sourceDate).slice(0,7)!==month) return;
      const f=it.fields||{};
      const key=[it.sourceDate,f.kind,f.bedTime,f.wakeTime,f.quality].join('|');
      if(seen.has(key)) return;
      seen.add(key); out.push(it);
    });
    const buckets={};
    out.forEach(it=>{ const q=Number(it.fields.quality)||0; const k=q?`${q}星`:'未评分'; buckets[k]=(buckets[k]||0)+1; });
    return buckets;
  },
  bodyByMonth(month){
    const d=Store._read();
    return Object.keys(d.byDate).filter(ds=>ds.slice(0,7)===month).sort().map(ds=>{
      const bd=d.byDate[ds].bodyMind&&d.byDate[ds].bodyMind.bodyData;
      return {date:ds,weight:bd&&Number(bd.weight)||0,bodyFat:bd&&Number(bd.bodyFat)||0};
    }).filter(x=>x.weight||x.bodyFat);
  }
};

/* ============================================================
   Charts：本地 canvas 图表（无 CDN，断网可用）
   ============================================================ */
const Charts = {
  jobs:[],
  defer(fn){ this.jobs.push(fn); },
  flush(){ const jobs=this.jobs.slice(); this.jobs=[]; requestAnimationFrame(()=>{ jobs.forEach(f=>{ try{f();}catch(e){console.warn(e);} }); }); },
  prepare(id){
    const c=document.getElementById(id);
    if(!c) return null;
    const box=c.parentElement;
    const w=box.clientWidth||300, h=box.clientHeight||180;
    const dpr=window.devicePixelRatio||1;
    c.width=w*dpr; c.height=h*dpr; c.style.width=w+'px'; c.style.height=h+'px';
    const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
    ctx.textBaseline='alphabetic';
    return {ctx,w,h};
  },
  pie(id,labels,values,colors){
    const p=this.prepare(id); if(!p) return;
    const {ctx,w,h}=p, total=values.reduce((a,b)=>a+Number(b||0),0);
    const cx=w/2,cy=h/2,r=Math.min(w,h)/2-24;
    if(total<=0){ ctx.fillStyle='#C4B5B9'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('暂无数据',cx,cy); return; }
    let a0=-Math.PI/2;
    values.forEach((v,i)=>{
      const a1=a0+Math.PI*2*(Number(v)||0)/total;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
      ctx.fillStyle=colors[i]||'#FF6B9D'; ctx.fill();
      a0=a1;
    });
    ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--card-bg').trim()||'#fff'; ctx.fill();
    ctx.font='12px sans-serif'; ctx.fillStyle='#9B8A8E'; ctx.textAlign='center';
    ctx.fillText(labels.map((l,i)=>l+' '+Math.round(values[i]/total*100)+'%').join('  '),cx,h-6);
  },
  line(id,points,yLabel){
    const p=this.prepare(id); if(!p) return;
    const {ctx,w,h}=p;
    if(!points.length){ ctx.fillStyle='#C4B5B9'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('本月还没有记录，填一次体重或体脂就能看到走势',w/2,h/2); return; }
    const pad={l:36,r:14,t:16,b:28};
    const vals=points.flatMap(x=>[x.weight,x.bodyFat]).filter(v=>v>0);
    if(!vals.length){
      // 有月份坐标但一条记录都没有：给出空状态，而不是留一块空白画布
      ctx.fillStyle='#C4B5B9'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('本月还没有记录，填一次体重或体脂就能看到走势',w/2,h/2);
      return;
    }
    const max=Math.max.apply(null,vals.concat([1])), min=Math.min.apply(null,vals.concat([max]));
    const x=i=>pad.l+(w-pad.l-pad.r)*(points.length===1?0.5:i/(points.length-1));
    const y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-min)/((max-min)||1));
    ctx.strokeStyle='rgba(255,107,157,.25)'; ctx.lineWidth=1;
    for(let i=0;i<=4;i++){ const yy=pad.t+(h-pad.t-pad.b)*i/4; ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(w-pad.r,yy); ctx.stroke(); }
    const draw=(key,color)=>{
      ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=2;
      points.forEach((pt,i)=>{ if(!pt[key]) return; i===0?ctx.moveTo(x(i),y(pt[key])):ctx.lineTo(x(i),y(pt[key])); });
      ctx.stroke();
      points.forEach((pt,i)=>{ if(!pt[key]) return; ctx.beginPath(); ctx.arc(x(i),y(pt[key]),3,0,Math.PI*2); ctx.fillStyle=color; ctx.fill(); });
    };
    draw('weight','#FF6B9D'); draw('bodyFat','#FFD93D');
    ctx.font='10px sans-serif'; ctx.fillStyle='#9B8A8E'; ctx.textAlign='center';
    points.forEach((pt,i)=>{ if(i%Math.max(1,Math.ceil(points.length/6))===0) ctx.fillText(pt.date.slice(5),x(i),h-8); });
  }
};

/* ============================================================
   Draft：多字段条目的草稿层（点「保存记录」之前不落库）
   ============================================================ */
const FORM_SCOPES=['bodyMind.sleep','bodyMind.media','bodyMind.medical','bodyMind.skincare',
  'bodyMind.exercise','inspiration','reflection','plan:weekly','plan:monthly','plan:yearly'];
function isFormScope(s){ return FORM_SCOPES.indexOf(s)>-1; }

const Draft = {
  map:{},
  key(scope,slot){ return scope+'|'+slot; },
  get(scope,slot){ return this.map[this.key(scope,slot)]||null; },
  has(scope,slot){ return !!this.map[this.key(scope,slot)]; },
  open(scope,slot,init){
    init=init||{};
    const date=init.date||State.currentDate;
    this.map[this.key(scope,slot)]={
      scope:scope, slot:slot, id:init.id||'', isNew:!init.id,
      date:date, sourceDate:date, _date:date,
      text:init.text||'',
      fields:Object.assign({},init.fields||{}),
      touched:false,
      base:'',
      dirty:false
    };
    const d=this.map[this.key(scope,slot)];
    d.base=this.snap(d);
    return d;
  },
  // 内容指纹：text + 排序后的 fields，用于和打开时的基准比对
  snap(d){
    const f=d.fields||{};
    const norm=Object.keys(f).sort().map(k=>{ const v=f[k]; return [k, v===undefined?null:v]; });
    return JSON.stringify([String(d.text==null?'':d.text).trim(), norm]);
  },
  // 默认值补齐后（如 sleep 的 kind）重设基准，避免把默认值当成用户输入
  rebase(scope,slot){
    const d=this.get(scope,slot);
    if(d&&!d.touched){ d.base=this.snap(d); d.dirty=false; }
  },
  ensure(scope,slot,init){
    if(!this.has(scope,slot)) this.open(scope,slot,init);
    return this.get(scope,slot);
  },
  set(scope,slot,path,value){
    const d=this.get(scope,slot); if(!d) return;
    if(path.indexOf('fields.')===0) d.fields[path.slice(7)]=value;
    else if(path==='text') d.text=value;
    else d[path]=value;
    // 计划 / 灵感的「花费时间」随日期联动
    if(path==='fields.planDate'||path==='fields.realizeDate'||path==='fields.startDate'){
      const a=scope.indexOf('plan:')===0?d.fields.planDate:d.fields.startDate;
      d.fields.durationToRealize=(d.fields.realizeDate&&a)?Utils.daysBetween(a,d.fields.realizeDate):'';
    }
    d.touched=true;
    d.dirty=this.snap(d)!==d.base;
  },
  filled(scope,slot){
    const d=this.get(scope,slot); if(!d) return false;
    if(String(d.text||'').trim()) return true;
    return Object.keys(d.fields).some(k=>{
      const v=d.fields[k];
      return v!==''&&v!==null&&v!==undefined&&v!==0&&v!==false;
    });
  },
  isDirty(scope,slot){
    const d=this.get(scope,slot);
    if(!d) return false;
    return this.snap(d)!==d.base;
  },
  dirtyCount(){
    return Object.keys(this.map).filter(k=>this.isDirty(this.map[k].scope,this.map[k].slot)).length;
  },
  close(scope,slot){ delete this.map[this.key(scope,slot)]; },
  clear(){ this.map={}; },
  save(scope,slot){
    const d=this.get(scope,slot); if(!d) return false;
    // 新记录必须真的填过内容（默认值不算），避免存下一条空记录
    if(!d.id && !d.touched){ Utils.toast('请先填写内容'); return false; }
    const date=d.date||State.currentDate;
    if(d.id) Store.patch(scope,d.id,{text:d.text,fields:Object.assign({},d.fields)},{date,label:'保存记录',quiet:true});
    else Store.add(scope,Item.make(d.text,d.fields,{sourceDate:date,periodKey:Utils.periodKey(scope.replace('plan:',''),date),carryPolicy:'keep'}),{date,label:'新增记录',quiet:true});
    this.close(scope,slot);
    State.render();
    Utils.toast('已保存');
    return true;
  }
};

const UI = {

    </div>`;
  },
  recRow(scope,item,opts){
    opts=opts||{};
    const date=opts.date||item._date||item.sourceDate||State.currentDate;
    const attrs=`data-scope="${Utils.esc(scope)}" data-id="${item.id}" data-date="${date}"`;
    const toggle=opts.toggle?`<span class="check-dot ${item.done?'done':''}" data-action="toggle" ${attrs} title="标记完成">${item.done?'✅':'⭕'}</span>`:'';
    const carry=(opts.carry&&!item.done)?`<button class="icon-btn ${item.carriedTo?'carried':''}" data-action="carry-open" ${attrs} title="${item.carriedTo?'已结转，点击可还原':'结转到其他周期'}">↷</button>`:'';
    return `<div class="u-row rec-row">
      <div class="row-main">

        ${Item.badge(item)}
        <span class="row-actions">
          <button class="icon-btn" data-action="rec-edit" ${attrs} title="编辑">✎</button>
          ${carry}
          <button class="icon-btn" data-action="delete" ${attrs} title="删除">✕</button>
        </span>
      </div>
      ${opts.summary?`<div class="rec-summary">${opts.summary(item)}</div>`:''}
    </div>`;
  },
  formCard(scope,slot,spec,opts){
    opts=opts||{};
    const d=Draft.get(scope,slot);
    if(!d) return '';
    const dirty=Draft.isDirty(scope,slot);
    const fields=spec.map(f=>{
      const one=this.field(scope,d,f.path,f.label,f.type,f.opts||{});
      return f.full?`<div style="grid-column:1/-1">${one}</div>`:one;
    }).join('');
    return `<div class="rec-form-card" data-draft-form="1" data-dscope="${Utils.esc(scope)}" data-dslot="${Utils.esc(slot)}">
      <div class="rec-form-head">
        <span class="rec-form-title">${opts.icon||'📝'} ${Utils.esc(opts.title||'新增记录')}</span>
        <span class="draft-dot" style="${dirty?'':'display:none'}"></span>
      </div>
      <div class="field-grid">${fields}</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-sm${dirty?'':' btn-dim'}" style="flex:2;" data-action="draft-save" data-scope="${Utils.esc(scope)}" data-slot="${Utils.esc(slot)}">保存记录</button>
        <button class="btn btn-sm btn-outline" style="flex:1;" data-action="draft-cancel" data-scope="${Utils.esc(scope)}" data-slot="${Utils.esc(slot)}">取消</button>
      </div>
    </div>`;
  },
  field(scope,item,path,label,type,opts){
    opts=opts||{};
    const v=path.indexOf('fields.')===0?(item.fields||{})[path.slice(7)]:item[path];
    const attrs=`data-scope="${Utils.esc(scope)}" data-id="${item.id}" data-date="${item._date||item.sourceDate||State.currentDate}" data-field="${path}"`;
    if(type==='select'){
      return `<div class="field"><div class="field-label">${label}</div><select class="select" ${attrs}>${opts.options.map(o=>`<option value="${Utils.esc(o)}" ${String(v||'')===String(o)?'selected':''}>${Utils.esc(o||'未选择')}</option>`).join('')}</select></div>`;
    }
    if(type==='textarea'){
      return `<div class="field"><div class="field-label">${label}</div><textarea class="textarea" ${attrs} placeholder="${Utils.esc(label)}">${Utils.esc(v||'')}</textarea></div>`;
    }
    if(type==='range'){
      return `<div class="field"><div class="field-label">${label} <b class="range-val">${Number(v)||0}%</b></div><input type="range" min="0" max="100" value="${Number(v)||0}" ${attrs} oninput="this.parentElement.querySelector('.range-val').textContent=this.value+'%'"></div>`;
    }
    const cls='input'+(type==='date'?' input-date':type==='time'?' input-time':type==='datetime-local'?' input-datetime':'');
    return `<div class="field"><div class="field-label">${label}</div><input type="${type||'text'}" class="${cls}" value="${Utils.esc(v==null?'':v)}" ${attrs} placeholder="${Utils.esc(label)}" ${opts.readonly?'readonly':''} ${type==='number'?'step="any"':''}></div>`;
  },
  collapse(key,title,emoji,count,inner){
    const open=!!State.ui('collapse')[key];
    return `<div class="card">
      <div class="collapse-head ${open?'open':''}" data-collapse="${key}">
        <div class="card-title" style="margin:0;"><span class="emoji">${emoji}</span>${title}</div>
        <div>${count!=null?`<span class="time-tag">${count} 项</span>`:''}<span class="arrow">▶</span></div>
      </div>
      <div class="collapse-body ${open?'open':''}">${inner}</div>
    </div>`;
  },
  carryBanner(items){
    if(!items.length) return '';
    return `<div class="card carry-card"><div class="card-title"><span class="emoji">🔄</span>本期顺延提醒</div>
      <div style="font-size:13px;color:var(--text-sub);">有 ${items.length} 项从上一周期顺延而来，已保留原始记录与顺延次数。</div>
      <div style="margin-top:6px;">${items.slice(0,5).map(i=>`<span class="carry-badge">${Utils.esc(i.text)} · ${String(i.carryFrom.date).slice(5)}</span>`).join(' ')}</div>
    </div>`;
  }
};

  ],
  SEASONS:{
    spring:{key:'spring',name:'春日',emoji:'🌸',from:3,to:5,colors:['#FF8FB4','#FFD1DC'],tip:'春风十里，不如你'},
    summer:{key:'summer',name:'盛夏',emoji:'🌻',from:6,to:8,colors:['#FFB13D','#FFE08A'],tip:'盛夏光年，尽情生长'},
    autumn:{key:'autumn',name:'秋日',emoji:'🍂',from:9,to:11,colors:['#E8873B','#F7C98B'],tip:'秋高气爽，收获满满'},
    winter:{key:'winter',name:'深冬',emoji:'❄️',from:12,to:2,colors:['#6FA8DC','#BFD9F2'],tip:'冬日暖阳，静静蓄力'}
  },
  RANKS:[
    {min:0,title:'小种子',emoji:'🌰',next:3},
    {min:3,title:'小嫩芽',emoji:'🌱',next:7},
    {min:7,title:'小树苗',emoji:'🌿',next:15},
    {min:15,title:'小花匠',emoji:'🌷',next:30},
    {min:30,title:'花园主人',emoji:'🌺',next:60},
    {min:60,title:'时光园丁',emoji:'🌳',next:100},
    {min:100,title:'生活大师',emoji:'🏵️',next:Infinity}
  ],
  season(dateStr){
    const m=Number(String(dateStr||Utils.todayStr()).slice(5,7));
    const s=Object.values(this.SEASONS).find(x=>m>=x.from&&m<=x.to);
    return s||this.SEASONS.spring;
  },
  quote(dateStr){
    const s=String(dateStr||Utils.todayStr());
    let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
    return this.QUOTES[h%this.QUOTES.length];
  },
  greeting(){
    const h=new Date().getHours();
    if(h<6) return '夜深了，早点休息';
    if(h<11) return '早安，笨笨';
    if(h<14) return '中午好，记得吃饭';
    if(h<18) return '下午好，加油呀';
    if(h<22) return '晚上好，辛苦啦';
    return '夜深了，早点休息';
  },
  // 某天是否有打卡记录（任一每日事项完成，或任一天条目存在且当天有操作）
  dayHasActivity(dateStr){
    const day=Store._read().byDate[dateStr];
    if(!day) return false;
    const items=(day.dailyPlan&&day.dailyPlan.items)||[];
    if(items.some(i=>i.done&&Item.visible(i))) return true;
    return Object.keys(day).some(k=>{
      if(k==='dailyPlan'||k==='bodyData') return false;
      const node=day[k];
      if(!node||typeof node!=='object') return false;
      if(Array.isArray(node.items)) return node.items.some(i=>Item.visible(i));
      return Object.keys(node).some(sub=>node[sub]&&Array.isArray(node[sub].items)&&node[sub].items.some(i=>Item.visible(i)));
    });
  },
  streak(dateStr){
    let d=dateStr||Utils.todayStr(), n=0, guard=0;
    // 如果今天还没记录，从昨天开始算（不打断昨天的连续）
    if(!this.dayHasActivity(d)) d=Utils.toDateStr(new Date(Utils.parseDate(d).getTime()-86400000));
    while(this.dayHasActivity(d)&&guard++<730){
      n++;
      d=Utils.toDateStr(new Date(Utils.parseDate(d).getTime()-86400000));
    }
    return n;
  },
  rank(streak){
    let r=this.RANKS[0];
    for(const x of this.RANKS){ if(streak>=x.min) r=x; }
    return r;
  },
  // 今日花园：done/total 决定开花数量；返回 SVG
  garden(done,total,streak){
    const totalN=Math.max(total,4);
    const bloomN=Math.min(totalN,Math.round(done/Math.max(total,1)*totalN));
    const pos=[{x:52,s:1},{x:118,s:1.12},{x:186,s:.92},{x:250,s:1.05},{x:316,s:.88},{x:380,s:1}];
    const maxFlowers=Math.min(6,totalN);
    const flowers=pos.slice(0,maxFlowers).map((p,i)=>{
      const on=i<Math.min(maxFlowers,bloomN);
      const cy=100, top=on?56+(i%2)*6:82;
      const stem=`<path d="M${p.x} ${cy} L${p.x} ${top}" fill="none" stroke="#6FAE5A" stroke-width="2.4"/>`;
      const leaf=`<ellipse cx="${p.x-9}" cy="${(cy+top)/2}" rx="9" ry="3.6" fill="#9BD07C"/><ellipse cx="${p.x+9}" cy="${(cy+top-8)}" rx="9" ry="3.6" fill="#9BD07C"/>`;
      if(!on) return stem+leaf+`<circle cx="${p.x}" cy="${top}" r="4" fill="#D9D2CE"/>`;
      const petals=[[0,-9],[8,-3],[5,8],[-5,8],[-8,-3]].map(([dx,dy])=>`<circle cx="${p.x+dx}" cy="${top+dy}" r="6.5" fill="${i%2?'#FFD166':'#F48FB1'}"/>`).join('');
      return stem+leaf+petals+`<circle cx="${p.x}" cy="${top}" r="5" fill="#FFB300"/>`;
    }).join('');
    return `<svg viewBox="0 0 430 112" width="100%" role="img" aria-label="今日花园">
      <title>今日花园</title><desc>已完成 ${done} 项，共 ${total} 项，连续 ${streak} 天</desc>
      <circle cx="404" cy="22" r="13" fill="#FFD166"/>
      <path d="M16 100 L416 100" fill="none" stroke="#E8DCC8" stroke-width="2"/>
      ${flowers}
      ${streak>=3?`<path d="M22 96 q4 -14 9 0 q4 -10 8 0" fill="none" stroke="#7BC47F" stroke-width="2"/>`:''}
    </svg>`;
  },
  // 近 N 天热力图（按每天完成数着色）
  heatmap(dateStr,days){
    days=days||28;
    const end=Utils.parseDate(dateStr||Utils.todayStr());
    const cells=[];
    for(let i=days-1;i>=0;i--){
      const ds=Utils.toDateStr(new Date(end.getTime()-i*86400000));
      const day=Store._read().byDate[ds];
      const items=((day&&day.dailyPlan&&day.dailyPlan.items)||[]).filter(x=>Item.visible(x));
      const done=items.filter(x=>x.done).length;
      let lv=0;
      if(done>0) lv=1;
      if(done>=3) lv=2;
      if(done>=5) lv=3;
      if(done>=7) lv=4;
      cells.push({ds,done,lv});
    }
    return cells;
  },
  heatmapHTML(dateStr,days){
    const cells=this.heatmap(dateStr,days);
    const colors=['#F4E7EB','#F7C9D6','#F09AB4','#DB6E92','#B8446C'];
    return `<div class="heat-row">${cells.map(c=>`<span class="heat-cell" style="background:${colors[c.lv]};" title="${c.ds} · 完成 ${c.done} 项"></span>`).join('')}</div>`;
  },
  // 月度小报：统计当月各类数据
  monthlyReport(dateStr){
    const month=String(dateStr||Utils.todayStr()).slice(0,7);
    const all=Store._read().byDate;
    const dates=Object.keys(all).filter(ds=>ds.slice(0,7)===month);
    let done=0, sleep=0, drink=0, media=0, exercise=0, med=0, activeDays=0;
    dates.forEach(ds=>{
      const day=all[ds];
      const dp=(day.dailyPlan&&day.dailyPlan.items)||[];
      const d=dp.filter(x=>x.done&&Item.visible(x)).length;
      done+=d; if(d>0) activeDays++;
      const bm=day.bodyMind||{};
      if(bm.sleep&&bm.sleep.items) sleep+=bm.sleep.items.filter(x=>Item.visible(x)).length;
      if(bm.drink&&bm.drink.items) drink+=bm.drink.items.filter(x=>Item.visible(x)).length;
      if(bm.media&&bm.media.items) media+=bm.media.items.filter(x=>Item.visible(x)).length;
      if(bm.exercise&&bm.exercise.items) exercise+=bm.exercise.items.filter(x=>Item.visible(x)).length;
      if(bm.medical&&bm.medical.items) med+=bm.medical.items.filter(x=>Item.visible(x)).length;
    });
    const lines=[];
    lines.push(`🌸 本月打卡 <b>${done}</b> 次，坚持了 <b>${activeDays}</b> 天`);
    if(drink) lines.push(`☕ 记录了 <b>${drink}</b> 杯茶饮咖啡`);
    if(sleep) lines.push(`😴 记录了 <b>${sleep}</b> 次睡眠`);
    if(media) lines.push(`📖 看过 <b>${media}</b> 部/本书`);
    if(exercise) lines.push(`🏃 锻炼了 <b>${exercise}</b> 次`);
    if(med) lines.push(`🏥 就医复盘 <b>${med}</b> 次`);
    if(done===0) lines.push('新的一月，从今天开始记录吧~');
    return {month,lines,done,activeDays};
  },
  // 故事流：把当天各类记录按时间串成一篇日记
  story(dateStr){
    const d=dateStr||Utils.todayStr();
    const day=Store._read().byDate[d];
    if(!day) return [];
    const out=[];
    const push=(time,emoji,kind,text)=>{ if(text) out.push({time:time||'今日',emoji,kind,text:String(text)}); };
    const dp=(day.dailyPlan&&day.dailyPlan.items)||[];
    dp.filter(x=>x.done&&Item.visible(x)).forEach(x=>push('','✅','打卡',x.text+(x.fields.owner==='benben'?'（妈妈）':x.fields.owner==='tiaotiao'?'（宝宝）':'')));
    const bm=day.bodyMind||{};
    (bm.sleep&&bm.sleep.items||[]).filter(x=>Item.visible(x)&&(x.fields.bedTime||x.fields.wakeTime)).forEach(x=>push(x.fields.wakeTime||'','😴','睡眠',`${x.fields.kind==='nap'?'午睡':'夜间'} ${x.fields.bedTime||'--'}~${x.fields.wakeTime||'--'}`));
    (bm.drink&&bm.drink.items||[]).filter(x=>Item.visible(x)).forEach(x=>push(x.fields.time||'','☕','茶饮',`${x.text}${x.fields.amount?' '+x.fields.amount+'ml':''}`));
    (bm.exercise&&bm.exercise.items||[]).filter(x=>Item.visible(x)).forEach(x=>push('','🏃','锻炼',`${x.text}${x.fields.duration?' '+x.fields.duration+'分钟':''}`));
    (bm.media&&bm.media.items||[]).filter(x=>Item.visible(x)).forEach(x=>push(x.fields.mediaTime||'','📖','观阅',x.text));
    (bm.diet&&bm.diet.items||[]).filter(x=>Item.visible(x)&&x.text).forEach(x=>push('','🍱','饮食',x.text));
    ((day.readingQueue&&day.readingQueue.items)||[]).filter(x=>x.done&&Item.visible(x)).forEach(x=>push(x.fields.completedDate?String(x.fields.completedDate).slice(11,16):'','📚','待阅','读完《'+x.text+'》'));
    ((day.inspiration&&day.inspiration.items)||[]).filter(x=>Item.visible(x)).forEach(x=>push('','💡','灵感',x.text));
    ((day.reflection&&day.reflection.items)||[]).filter(x=>Item.visible(x)).forEach(x=>push(x.fields.time?String(x.fields.time).slice(11,16):'','📝','碎碎念',x.text));
    const order={'':0};
    return out.sort((a,b)=>String(a.time).localeCompare(String(b.time))).slice(0,14);
  },
  storyHTML(dateStr){
    const items=this.story(dateStr);
    if(!items.length) return '<div class="empty-state">今天还没有故事，去记录第一笔吧~</div>';
    return `<div class="story-flow">${items.map(i=>`<div class="story-item"><span class="story-time">${Utils.esc(i.time)}</span><span class="story-dot"></span><div class="story-body"><span class="story-kind">${Utils.esc(i.kind)}</span><div>${Utils.esc(i.text)}</div></div></div>`).join('')}</div>`;
  },
  // 彩蛋称号判定：返回本次新解锁的称号（若里程碑）
  milestone(streak){
    const hit=[7,15,30,60,100].find(n=>streak===n);
    if(!hit) return null;
    const r=this.rank(hit);
    return `🎉 解锁新称号「${r.title}」${r.emoji} · 连续打卡 ${hit} 天！`;
  },
  checkMilestone(streak){
    try{
      const key='workbench_milestone_shown';
      const shown=Number(localStorage.getItem(key)||0);
      if(streak<=shown) return;
      const msg=this.milestone(streak);
      localStorage.setItem(key,String(streak));
      if(msg) Utils.toast(msg);
    }catch(e){}
  },
  spark(el){
    if(!el||!el.getBoundingClientRect||!document.body||!document.createElement) return;
    const r=el.getBoundingClientRect();
    if(!r||!r.width) return;
    const colors=['#FF6B9D','#FFD93D','#7BD389','#7FB8ED','#C39BD3'];
    for(let i=0;i<6;i++){
      const sp=document.createElement('span');
      sp.className='delight-spark';
      sp.style.left=(r.left+r.width/2)+'px';
      sp.style.top=(r.top+r.height/2)+'px';
      sp.style.background=colors[i%colors.length];
      if(sp.style.setProperty){
        sp.style.setProperty('--dx',((Math.random()-.5)*80)+'px');
        sp.style.setProperty('--dy',((Math.random()-.5)*80-24)+'px');
      }
      document.body.appendChild(sp);
      setTimeout(()=>{ if(sp.remove) sp.remove(); },650);
    }
  },
  themeList(){
    return [
      {key:'light',name:'浅色',emoji:'☀️'},
      {key:'dark',name:'深色',emoji:'🌙'},
      {key:'sakura',name:'樱花粉',emoji:'🌸'},
      {key:'mint',name:'薄荷绿',emoji:'🌿'},
      {key:'sunset',name:'日落橙',emoji:'🌇'},
      {key:'ocean',name:'海洋蓝',emoji:'🌊'}
    ];
  },
  applyTheme(theme){
    const root=document.documentElement;
    if(root&&root.setAttribute) root.setAttribute('data-theme',theme||'light');
    const meta=document.querySelector&&document.querySelector('meta[name="theme-color"]');
    const map={light:'#FFF5F8',dark:'#211A1E',sakura:'#FFF0F5',mint:'#EAF7F1',sunset:'#FFF1E8',ocean:'#EAF3FB'};
    if(meta&&meta.setAttribute) meta.setAttribute('content',map[theme]||map.light);
  }
};

function homeOverview(day){
  const parts=[];
  const labelOf={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐',fruit:'水果'};
  const bm=day.bodyMind||{};
  const sleep=Store.getItems('bodyMind.sleep',State.currentDate);
  if(sleep.length){
    const str=sleep.filter(i=>i.fields.bedTime||i.fields.wakeTime).map(i=>`${i.fields.kind==='nap'?'☀️':'🌙'} ${i.fields.bedTime||'--'}~${i.fields.wakeTime||'--'} ${Utils.calcDuration(i.fields.bedTime,i.fields.wakeTime)} ${'⭐'.repeat(i.fields.quality||0)}`).join(' | ');
    if(str) parts.push({emoji:'😴',label:'睡眠',val:str});
  }
  const diet=Store.getItems('bodyMind.diet',State.currentDate).filter(i=>i.text);
  if(diet.length) parts.push({emoji:'🍱',label:'饮食',val:diet.map(i=>labelOf[i.fields.meal]+':'+i.text).join(' ')});
  const drink=Store.getItems('bodyMind.drink',State.currentDate);
  if(drink.length) parts.push({emoji:'☕',label:'茶饮',val:drink.map(i=>`[${i.fields.category||'未分类'}]${i.text}${i.fields.amount?i.fields.amount+'ml':''}`).join('；')});
  const ex=Store.getItems('bodyMind.exercise',State.currentDate);
  if(ex.length) parts.push({emoji:'🏃',label:'锻炼',val:ex.map(i=>`${i.text} ${i.fields.duration||0}分`).join('；')});
  const media=Store.getItems('bodyMind.media',State.currentDate);
  if(media.length) parts.push({emoji:'📖',label:'观阅',val:media.map(i=>`${i.text} ${i.fields.type||''}`).join('；')});
  const sk=Store.getItems('bodyMind.skincare',State.currentDate);
  if(sk.length) parts.push({emoji:'🧴',label:'护肤',val:sk.map(i=>`${i.text} ${i.fields.product||''}`).join('；')});
  const bd=bm.bodyData||{};
  if(bd.weight) parts.push({emoji:'⚖️',label:'体重',val:bd.weight+'kg'+(bd.bodyFat?' / 体脂'+bd.bodyFat+'%':'')});
  const med=Store.getItems('bodyMind.medical',State.currentDate);
  if(med.length) parts.push({emoji:'🏥',label:'就医',val:med.map(i=>`${i.fields.date||''} ${i.text} ${i.fields.duration||''}`).join('；')});
  const hasData=parts.length>0;
  if(State.ui('collapse').homeBodyMindOverview===undefined)
    Store.commit(d=>{ d.ui.collapse.homeBodyMindOverview=hasData; },{label:'折叠默认值',quiet:true,render:false});
  const open=State.ui('collapse').homeBodyMindOverview;
  return `<div class="card">
    <div class="collapse-head ${open?'open':''}" data-collapse="homeBodyMindOverview">
      <div class="card-title" style="margin:0;"><span class="emoji">🌿</span>今日身心成长总览</div>
      <div>${hasData?`<span class="time-tag">${parts.length}项</span>`:''}<span class="arrow">▶</span></div>
    </div>
    <div class="collapse-body ${open?'open':''}">
      ${hasData?parts.map(p=>`<div class="overview-row"><span>${p.emoji}</span><div><span class="field-label">${p.label}</span><div>${Utils.esc(p.val)}</div></div></div>`).join(''):'<div class="empty-state">点击进入身心成长记录睡眠 / 饮食 / 茶饮 / 锻炼等</div>'}
      <div style="text-align:center;margin-top:8px;"><button class="btn btn-sm btn-outline" data-action="nav" data-route="#bodymind">查看详情 →</button></div>
    </div>
  </div>`;
}
function homeReadingReminder(d){
  const all=Store.allItems('readingQueue',{filter:i=>!i.done});
  if(!all.length) return '';
  const soon=all.filter(i=>i.fields.ddl&&Math.round((Utils.parseDate(i.fields.ddl)-Utils.parseDate(d))/86400000)<=3);
  return `<div class="card" style="border-left:3px solid var(--sunflower);">
    <div class="card-title"><span class="emoji">📚</span>待阅提醒</div>
    <div style="font-size:13px;color:var(--text-sub);">还有 ${all.length} 项待阅${soon.length?`，其中 ${soon.length} 项即将到期`:''}</div>
    ${soon.length?soon.slice(0,5).map(i=>`<div class="overview-row"><span>⏰</span><div>${Utils.esc(i.text)} · ${i.fields.ddl}</div></div>`).join(''):''}
  </div>`;
}

function renderBodyMindSub(sub){
  const d=State.currentDate;
  const monthKeys={drink:'drinkMonth',bodyData:'bodyMonth',sleep:'sleepMonth'};
  if(monthKeys[sub.id]) State[monthKeys[sub.id]]=State[monthKeys[sub.id]]||d.slice(0,7);
  const vc=document.getElementById('view-container');
  const tabs=`<div class="bm-tabs">${CONFIG.BODYMIND_SUBS.map(s=>`<button class="bm-tab ${s.id===sub.id?'active':''}" data-sub="${s.id}">${s.emoji}${s.label}</button>`).join('')}</div>`;
  let body='';
  if(sub.id==='sleep') body=sleepPage(d);
  else if(sub.id==='diet') body=dietPage(d);
  else if(sub.id==='bodyData') body=bodyDataPage(d);
  else if(sub.id==='drink') body=drinkPage(d);
  else if(sub.id==='exercise') body=simpleListPage('bodyMind.exercise',d,'🏃','活动锻炼','锻炼类型',{'fields.duration':'时长(分)'});
  else if(sub.id==='media') body=mediaPage(d);
  else if(sub.id==='skincare') body=simpleListPage('bodyMind.skincare',d,'🧴','护肤养生','护理项目',{'fields.product':'产品','fields.duration':'时长(分)'});
  else if(sub.id==='medical') body=medicalPage(d);
  vc.innerHTML=tabs+`<button class="btn btn-sm btn-outline back-btn" data-action="bm-back">← 返回身心成长</button>`+body;
}
function sleepPage(d){
  const items=Store.getItems('bodyMind.sleep',d);
  const nap=items.find(i=>i.fields.kind==='nap');
  const night=items.find(i=>i.fields.kind==='night'&&!i.carryFrom);
  const block=(kind,title,rec)=>{
    const dr=Draft.ensure('bodyMind.sleep',kind,{
      id:rec?rec.id:'', date:d,
      text:kind==='nap'?'午睡':'夜间睡眠',
      fields:rec?Object.assign({},rec.fields):{kind:kind,bedTime:'',wakeTime:'',quality:0,dreamt:false}
    });
    if(rec&&!dr.id){ dr.id=rec.id; dr.isNew=false; }
    if(!dr.fields.kind) dr.fields.kind=kind;
    Draft.rebase('bodyMind.sleep',kind);
    const f=dr.fields||{}, dirty=Draft.isDirty('bodyMind.sleep',kind);
    return `<div class="rec-form-card sleep-block" data-draft-form="1" data-dscope="bodyMind.sleep" data-dslot="${kind}">
      <div class="sleep-head"><b>${title}</b><span class="draft-dot" style="${dirty?'':'display:none'}"></span></div>
      ${UI.field('bodyMind.sleep',dr,'fields.bedTime','入睡时间','time')}
      ${UI.field('bodyMind.sleep',dr,'fields.wakeTime','醒来时间','time')}
      <div class="field"><div class="field-label">睡眠质量 <span class="hint" style="font-weight:400;">${Number(f.quality)?Number(f.quality)+' 星':'未评分'}</span></div><div class="star-row">${[1,2,3].map(n=>`<button class="btn btn-sm ${Number(f.quality)===n?'':'btn-outline'}" data-action="draft-star" data-scope="bodyMind.sleep" data-slot="${kind}" data-q="${n}" aria-label="${n} 星" aria-pressed="${Number(f.quality)===n}">${'★'.repeat(n)}${'☆'.repeat(3-n)}</button>`).join('')}</div></div>
      <label class="checkbox-wrap"><input type="checkbox" data-scope="bodyMind.sleep" data-slot="${kind}" data-field="fields.dreamt" ${f.dreamt?'checked':''}> 💭 是否做梦</label>
      ${f.bedTime&&f.wakeTime?`<div class="hint">时长：${Utils.calcDuration(f.bedTime,f.wakeTime)}</div>`:''}
      <div class="btn-row" style="margin-top:9px;">
        <button class="btn btn-sm${dirty?'':' btn-dim'}" style="flex:2;" data-action="draft-save" data-scope="bodyMind.sleep" data-slot="${kind}">保存记录</button>
        ${rec?`<button class="btn btn-sm btn-outline" style="flex:1;" data-action="draft-reset" data-scope="bodyMind.sleep" data-slot="${kind}" data-date="${d}">还原</button>`:''}
      </div>
    </div>`;
  };
  const hist=Store.allItems('bodyMind.sleep').filter(i=>i.sourceDate!==d);
  const month=State.sleepMonth;
  Charts.defer(()=>{ const b=Stats.sleepByMonth(month); Charts.pie('sleep-month-pie',Object.keys(b),Object.values(b),['#FF6B9D','#FFD93D','#FFC4D6','#C4B5B9']); });
  return `<div class="card"><div class="card-title"><span class="emoji">😴</span>今日睡眠 <span class="rec-count">填写后点保存</span></div>${block('nap','☀️ 午睡',nap)}${block('night','🌙 夜间睡眠',night)}</div>
    <div class="card"><div class="card-title"><span class="emoji">📊</span>${month} 睡眠质量分布</div><div class="chart-container medium"><canvas id="sleep-month-pie"></canvas></div></div>
    ${UI.collapse('sleepHistory','历史睡眠记录','📋',hist.length,`<div class="month-nav"><button class="btn btn-sm btn-outline" data-action="month" data-key="sleepMonth" data-delta="-1">‹</button><b>${month}</b><button class="btn btn-sm btn-outline" data-action="month" data-key="sleepMonth" data-delta="1">›</button></div>${hist.filter(i=>i.sourceDate.startsWith(month)).map(i=>UI.row(i,'bodyMind.sleep',{date:i.sourceDate,detail:it=>`<div class="hint">${it.fields.bedTime||'--'}~${it.fields.wakeTime||'--'} · ${Utils.calcDuration(it.fields.bedTime,it.fields.wakeTime)} · ${'⭐'.repeat(it.fields.quality||0)}</div>`})).join('')||'<div class="empty-state">本月暂无历史记录</div>'}`)}`;
}

/* ============================================================
   Actions：data-action 单一事件委托
   ============================================================ */
const Actions = {
  handle(action,el,e){
    const scope=el.dataset.scope, id=el.dataset.id, date=el.dataset.date||State.currentDate;
    switch(action){
      case 'delete':
        if(scope.indexOf('template:')===0){
          const owner=scope.slice(9);
          Store.commit(d=>{
            const tpl=(d.templates[owner]||[]).find(x=>x.id===id);
            d.templates[owner]=(d.templates[owner]||[]).filter(x=>x.id!==id);
            d.templates.rev=(d.templates.rev||1)+1;
            if(!tpl) return;
            // 同步清理今天/未来由该模板生成、且还没完成的打卡项；已完成的历史记录保留
            const today=Utils.todayStr();
            Object.keys(d.byDate).forEach(ds=>{
              if(ds<today) return;
              const dp=d.byDate[ds]&&d.byDate[ds].dailyPlan;
              if(!dp||!Array.isArray(dp.items)) return;
              dp.items.forEach(it=>{
                if(!Item.visible(it)||it.done||it.carriedTo) return;
                const sameTpl=it.tplId===id;
                const sameText=!it.tplId&&it.text===tpl.text&&it.fields&&it.fields.owner===owner;
                if(sameTpl||sameText){ it.deletedAt=Utils.now(); it.updatedAt=it.deletedAt; }
              });
            });
          },{label:'删除模板',quiet:false});
          break;
        }
        {
          const row=(el.closest&&el.closest('.u-row'))||null;
          if(row&&row.classList&&row.classList.add){
            row.classList.add('removing');
            const sc=scope, did=id, dt=date;
            setTimeout(()=>Store.remove(sc,did,{date:dt}),220);
          } else Store.remove(scope,id,{date});
        }
        break;
      case 'toggle': {
        const it=Store.find(scope,id,date); if(!it) return;
        const wasDone=it.done;
        Store.patch(scope,id,{done:!it.done,fields:it.fields},{date,label:'切换完成',quiet:false});
        if(scope==='readingQueue'&&it.fields){
          Store.patch(scope,id,{fields:Object.assign({},it.fields,{completedDate:!it.done?Utils.now():null})},{date,quiet:true,render:false});
        }
        if(!wasDone&&el.classList&&el.classList.add){
          el.classList.add('burst'); Delight.spark(el);
          setTimeout(()=>{ if(el.classList&&el.classList.remove) el.classList.remove('burst'); },440);
        }
        break;
      }
      case 'up':
      case 'down':
        if(scope.indexOf('template:')===0){
          const owner=scope.slice(9), dir=action==='up'?-1:1;
          Store.commit(d=>{
            const arr=(d.templates[owner]||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
            const i=arr.findIndex(x=>x.id===id), j=i+dir;
            if(i<0||j<0||j>=arr.length) return false;
            const t=arr[i].order; arr[i].order=arr[j].order; arr[j].order=t;
            return true;
          },{label:'调整模板顺序',quiet:false});
        } else Store.reorder(scope,id,action==='up'?-1:1,{date});
        break;
      case 'edit': this.startEdit(el,scope,id,date); break;
      case 'add': this.add(el); break;
      case 'nav': State.navigate(el.dataset.route); document.getElementById('drawer').classList.remove('open'); break;
      case 'bm-back': State.bodyMindSub=null; State.render(); break;
      case 'undo': Undo.undo(); break;
      case 'export': exportData(); break;
      case 'import': importData(); break;
      case 'month': State[el.dataset.key]=Utils.shiftMonth(State[el.dataset.key],Number(el.dataset.delta)); State.render(); break;
      case 'sleep-q': this.sleepQuality(el,date); break;
      case 'draft-star':
        Draft.set(scope,el.dataset.slot,'fields.quality',Number(el.dataset.q));
        State.render();
        break;
      case 'draft-save': Draft.save(scope,el.dataset.slot); break;
      case 'draft-cancel': Draft.close(scope,el.dataset.slot); State.render(); break;
      case 'draft-reset': {
        const it=Store.find(scope,id||null,date);
        if(it) Draft.open(scope,el.dataset.slot,{id:it.id,date:date,text:it.text,fields:it.fields});
        State.render();
        break;
      }
      case 'rec-edit': {
        const it=Store.find(scope,id,date);
        if(!it){ Utils.toast('没找到这条记录'); break; }
        Draft.open(scope,id,{id:it.id,date:date||it.sourceDate,text:it.text,fields:it.fields});
        State.render();
        break;
      }
      case 'carry-open': CarryPanel.open(scope,id,date); break;
      case 'carry-pick': CarryPanel.pick(el.dataset.key); break;
      case 'carry-do': CarryPanel.confirm(); break;
      case 'carry-undo': CarryPanel.undo(); break;
      case 'carry-close': CarryPanel.close(); break;
      case 'sync-tpl': Carry.forceSync(el.dataset.date||State.currentDate); break;
      case 'poo-add': this.pooAdd(el,date); break;
      case 'poo-del': this.pooDel(el,date); break;
      case 'trash-restore': Store.restoreTrash(el.dataset.tid); break;
      case 'trash-purge': Store.purgeTrash(el.dataset.tid); break;
      case 'theme': Store.commit(d=>{ d.ui.theme=el.dataset.theme; },{label:'切换主题',quiet:true}); State.applyTheme(); State.render(); break;
      case 'icon-reset': Store.setCustomIcon(null); State.render(); break;
      case 'clear-all': clearAllData(); break;
      case 'sync-code-make': this.makeSyncCode(); break;
      case 'sync-code-apply': this.applySyncCode(); break;
      case 'webdav-upload': this.webdav('upload'); break;
      case 'webdav-download': this.webdav('download'); break;
    }
  },
  startEdit(el,scope,id,date){
    if(scope.indexOf('template:')===0){
      const owner=scope.slice(9);
      const arr=Store._read().templates[owner]||[];
      const it=arr.find(x=>x.id===id); if(!it) return;
      this.inlineEdit(el,text=>Store.commit(d=>{
        const t=d.templates[owner].find(x=>x.id===id);
        if(!t) return;
        const old=t.text;
        t.text=text; t.updatedAt=Utils.now();
        d.templates.rev=(d.templates.rev||1)+1;
        // 同步今天及以后查看日期里对应的未完成打卡项，避免旧文案残留
        Object.keys(d.byDate).forEach(ds=>{
          if(ds<Utils.todayStr()) return;
          const dp=d.byDate[ds]&&d.byDate[ds].dailyPlan;
          if(!dp||!Array.isArray(dp.items)) return;
          dp.items.forEach(it=>{
            if(Item.visible(it)&&!it.done&&it.text===old&&it.fields&&it.fields.owner===owner){ it.text=text; it.updatedAt=Utils.now(); }
          });
        });
      },{label:'编辑模板',quiet:true}));
      return;
    }
    const it=Store.find(scope,id,date); if(!it) return;
    // 手动改过文案的条目视为"用户自定义"，解除模板绑定，之后模板改名不再覆盖它
    this.inlineEdit(el,text=>Store.patch(scope,id,it.tplId?{text,tplId:null}:{text},{date,label:'编辑文本'}));
  },
  inlineEdit(el,commit){
    if(el.querySelector('input')) return;
    const old=el.textContent;
    el.innerHTML='<input class="input edit-input" style="padding:4px 8px;font-size:14px;" value="'+Utils.esc(old)+'">';
    const input=el.querySelector('input'); input.focus(); input.select();
    let done=false;
    const finish=save=>{
      if(done) return; done=true;
      const v=input.value.trim();
      if(save&&v!==old){ commit(v); State.render(); } else State.render();
    };
    input.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();finish(true);} if(ev.key==='Escape'){ev.preventDefault();finish(false);} });
    input.addEventListener('blur',()=>finish(true));
    input.addEventListener('click',ev=>ev.stopPropagation());
  },
  add(el){
    const scope=el.dataset.addScope, date=el.dataset.date||State.currentDate;
    const input=document.querySelector('[data-add-input="'+CSS.escape(scope)+'"]');
    const text=input?input.value.trim():'';
    if(!text){ Utils.toast('请输入内容'); return; }
    if(scope.indexOf('template:')===0){
      const owner=scope.slice(9);
      Store.commit(d=>{
        d.templates[owner].push(Item.make(text,{}, {order:d.templates[owner].reduce((m,x)=>Math.max(m,x.order||0),0)+100,carryPolicy:'carry'}));
        d.templates.rev=(d.templates.rev||1)+1;
      },{label:'添加模板'});
      return;
    }
    const fields={};
    if(scope==='dailyPlan') fields.owner=el.dataset.addKind||'benben';
    if(scope==='reflection'){
      // 碎碎念：记录时间默认取当前时刻，用户不必先写内容再回头补时间
      const n=new Date();
      fields.time=`${Utils.toDateStr(n)}T${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
    }
    if(scope==='inspiration'){
      // 灵感：想法日期默认今天
      fields.startDate=date; fields.realizeDate=''; fields.durationToRealize=''; fields.review=''; fields.selfRating=0;
    }
    if(scope==='plan:weekly'||scope==='plan:monthly'||scope==='plan:yearly'){
      const type=scope.slice(5);
      fields.planDate=date; fields.realizeDate=''; fields.review=''; fields.selfRating=0;
      Store.add(scope,Item.make(text,fields,{sourceDate:date,periodKey:Utils.periodKey(type,date),carryPolicy:'carry'}),{date,label:'添加计划'});
      return;
    }
    Store.add(scope,Item.make(text,fields,{sourceDate:date,periodKey:date,carryPolicy:scope==='readingQueue'||scope==='wishlist'||scope==='inspiration'?'carry':'keep'}),{date,label:'新增'});
  },
  sleepQuality(el,date){
    const kind=el.dataset.kind||'night', q=Number(el.dataset.q);
    const existing=el.dataset.id;
    if(existing&&Store.find('bodyMind.sleep',existing,date)){
      Store.patch('bodyMind.sleep',existing,{'fields.quality':q},{date,label:'睡眠质量',quiet:false});
      return;
    }
    // 草稿或失效 id：优先更新同类型（午睡/夜睡）已有条目，避免重复新建
    const hit=Store.getItems('bodyMind.sleep',date).find(i=>i.fields.kind===kind);
    if(hit){
      Store.patch('bodyMind.sleep',hit.id,{'fields.quality':q},{date,label:'睡眠质量',quiet:false});
    }else{
      Store.add('bodyMind.sleep',Item.make(kind==='nap'?'午睡':'夜间睡眠',{kind:kind,bedTime:'',wakeTime:'',quality:q,dreamt:false},{sourceDate:date,periodKey:date,carryPolicy:'keep'}),{date,label:'睡眠质量'});
    }
  },
  pooAdd(el,date){
    const input=document.getElementById('poo-time');
    const time=input?input.value:'';
    if(!time){ Utils.toast('请选择时间'); return; }
    const it=Store.find('dailyPlan',el.dataset.id,date); if(!it) return;
    Store.patch('dailyPlan',it.id,{done:true,'fields.times':(it.fields.times||[]).concat(time)},{date,label:'记录拉臭时间',quiet:false});
  },
  pooDel(el,date){
    const it=Store.find('dailyPlan',el.dataset.id,date); if(!it) return;
    const times=(it.fields.times||[]).slice(); times.splice(Number(el.dataset.idx),1);
    Store.patch('dailyPlan',it.id,{'fields.times':times},{date,label:'删除时间',quiet:false});
  },
  makeSyncCode(){
    const code=btoa(unescape(encodeURIComponent(Store.exportJSON())));
    const el=document.getElementById('sync-code'); if(el) el.value=code;
    Utils.toast('同步码已生成，复制给另一台设备');
  },
  applySyncCode(){
    const el=document.getElementById('sync-code');
    if(!el||!el.value.trim()){ Utils.toast('请先粘贴同步码'); return; }
    try{
      const json=decodeURIComponent(escape(atob(el.value.trim())));
      const mode=document.getElementById('import-mode')?document.getElementById('import-mode').value:'merge';
      Store.importJSON(json,mode);
      State.render(); Utils.toast('同步码已应用 ✅');
    }catch(err){ Utils.toast('同步码无效：'+err.message); }
  },
  async webdav(action){
    const sync=Store._read().meta.sync||{};
    const endpoint=sync.endpoint||document.querySelector('[data-sync="endpoint"]')?.value||'';
    const user=sync.user||document.querySelector('[data-sync="user"]')?.value||'';
    const pass=sync.pass||document.querySelector('[data-sync="pass"]')?.value||'';
    if(!endpoint){ Utils.toast('请填写 WebDAV 地址'); return; }
    const auth='Basic '+btoa(unescape(encodeURIComponent(user+':'+pass)));
    try{
      if(action==='upload'){
        const res=await fetch(endpoint,{method:'PUT',headers:{'Authorization':auth,'Content-Type':'application/json'},body:Store.exportJSON()});
        if(!res.ok) throw new Error('HTTP '+res.status);
        Store.commit(d=>{ d.meta.sync.lastSyncAt=Utils.now(); d.meta.lastExportAt=Utils.now(); },{label:'WebDAV 上传',quiet:true});
        Utils.toast('已上传到 WebDAV ☁️');
      }else{
        const res=await fetch(endpoint,{headers:{'Authorization':auth}});
        if(!res.ok) throw new Error('HTTP '+res.status);
        Store.importJSON(await res.text(),'merge');
        Store.commit(d=>{ d.meta.sync.lastSyncAt=Utils.now(); },{label:'WebDAV 拉取',quiet:true});
        State.render(); Utils.toast('已从 WebDAV 合并 ✅');
      }
    }catch(err){ Utils.toast('WebDAV 失败：'+err.message); }
  }
};

/* ============================================================
   字段统一保存：草稿先落库并回写 id，之后走 patch
   （change 与「打字即存」共用同一条路径）
   ============================================================ */
function saveField(t){
  const scope=t.dataset.scope, id=t.dataset.id, date=t.dataset.date, path=t.dataset.field;
  if(!scope||!path) return;
  // 草稿表单：只写内存，等用户点「保存记录」
  const form=t.closest?t.closest('[data-draft-form]'):null;
  if(form){
    const ds=form.dataset.dscope, dl=form.dataset.dslot;
    if(!ds||!dl) return;
    let dv=t.value;
    if(t.type==='checkbox') dv=t.checked;
    else if(t.type==='range') dv=Number(t.value);
    else if(t.type==='number') dv=t.value===''?'':Number(t.value);
    Draft.set(ds,dl,path,dv);
    const dirty=Draft.isDirty(ds,dl);
    const dot=form.querySelector('.draft-dot'); if(dot) dot.style.display=dirty?'':'none';
    const btn=form.querySelector('[data-action="draft-save"]'); if(btn) btn.classList.toggle('btn-dim',!dirty);
    if(t.type==='date'){ State.render(); return; }
    return;
  }
  if(!id){
    const ctxFields={};
    if(scope==='bodyMind.diet'){
      const row=t.closest&&t.closest('.diet-row');
      ctxFields.meal=(row&&row.dataset.meal)||'';
    }
    if(scope==='bodyMind.sleep'){
      ctxFields.kind=t.dataset.kind||(t.closest&&t.closest('[data-kind]')&&t.closest('[data-kind]').dataset.kind)||'night';
      ctxFields.bedTime=''; ctxFields.wakeTime=''; ctxFields.quality=0; ctxFields.dreamt=false;
    }
    if(scope==='dailyPlan'){
      const row=t.closest&&t.closest('[data-owner]');
      ctxFields.owner=t.dataset.owner||(row&&row.dataset.owner)||'benben';
    }
    const it=Item.make('',ctxFields,{sourceDate:date||State.currentDate,periodKey:date||State.currentDate,carryPolicy:'keep'});
    if(path.indexOf('fields.')===0) it.fields[path.slice(7)]=t.value; else it[path]=t.value;
    const created=Store.add(scope,it,{date:date||State.currentDate,label:'保存字段'});
    // 回写真实 id，避免后续每次输入都重复新建
    if(created&&created.id&&t.dataset) t.dataset.id=created.id;
    return;
  }
  let value=t.value;
  if(t.type==='checkbox') value=t.checked;
  if(t.type==='range') value=Number(t.value);
  if(t.type==='number') value=t.value===''?'':Number(t.value);
  const isPlan=scope.indexOf('plan:')===0;
  if(isPlan&&(path==='fields.planDate'||path==='fields.realizeDate')){
    const it=Store.find(scope,id,date);
    if(it){
      const f=Object.assign({},it.fields);
      f[path.slice(7)]=value||'';
      f.durationToRealize=(f.planDate&&f.realizeDate)?Utils.daysBetween(f.planDate,f.realizeDate):'';
      Store.patch(scope,id,{done:!!f.realizeDate,fields:f},{date,label:'计划日期'});
      State.render();
      return;
    }
  }
  if(scope==='inspiration'&&(path==='fields.startDate'||path==='fields.realizeDate')){
    const it=Store.find(scope,id,date);
    if(it){
      const f=Object.assign({},it.fields);
      f[path.slice(7)]=value||'';
      // 花费时间 = 落成日期 − 想法日期（自动生成）
      f.durationToRealize=(f.startDate&&f.realizeDate)?Utils.daysBetween(f.startDate,f.realizeDate):'';
      Store.patch(scope,id,{done:!!f.realizeDate,fields:f},{date,label:'灵感日期'});
      State.render();
      return;
    }
  }
  Store.patchPath(scope,id,path,value,{date,label:'修改字段',quiet:true,render:false});
}

/* ============================================================
   导入导出 / 清空 / 图标
   ============================================================ */
function exportData(){
  const blob=new Blob([Store.exportJSON()],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`workbench-v3-backup-${Utils.todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  Store.commit(d=>{ d.meta.lastExportAt=Utils.now(); },{label:'导出',quiet:true});
  Utils.toast('已导出备份 📤');
}
function importData(){
  const input=document.getElementById('import-file-hidden');
  input.onchange=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const mode=document.getElementById('import-mode')?document.getElementById('import-mode').value:'merge';
        const incoming=Store.importJSON(reader.result,mode);
        State.render();
        Utils.toast(`导入成功：${Object.keys(incoming.byDate).length} 天记录（${mode==='merge'?'已合并':'已替换'}）`);
      }catch(err){
        console.error('导入失败',err);
        // 结构畸形不再把 JS 报错原文抛给用户
        const msg=/forEach|is not a function|of undefined|of null|Cannot read/.test(String(err&&err.message||''))
          ? '备份文件结构异常，可能已损坏或不是完整导出文件'
          : (err&&err.message)||'未知错误';
        Utils.toast('导入失败：'+msg);
      }
    };
    reader.readAsText(file);
    input.value='';
  };
  input.click();
}
function clearAllData(){
  if(!confirm('确定清空所有数据吗？建议先导出备份。')) return;
  if(!confirm('再次确认：真的要清空所有数据吗？')) return;
  localStorage.setItem(SNAPSHOT_KEY,JSON.stringify({savedAt:Utils.now(),data:Store._read()}));
  localStorage.removeItem(STORE_KEY);
  Store._cache=null; Store._read();
  State.currentDate=Utils.todayStr(); State.isToday=true;
  State.render(); Utils.toast('已清空，旧数据已保留快照');
}
function compressImage(dataUrl,maxSize,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(Math.max(w,h)>maxSize){ if(w>=h){ h=Math.round(h*maxSize/w); w=maxSize; } else { w=Math.round(w*maxSize/h); h=maxSize; } }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/png',0.9));
  };
  img.onerror=()=>cb(dataUrl); img.src=dataUrl;
}

/* ============================================================
   日历
   ============================================================ */
const Calendar = {
  viewDate:Utils.todayStr(),
  open(){ this.viewDate=State.currentDate; this.render(); document.getElementById('calendar-modal').classList.add('show'); },
  close(){ document.getElementById('calendar-modal').classList.remove('show'); },
  render(){
    const d=Utils.parseDate(this.viewDate), y=d.getFullYear(), m=d.getMonth();
    const first=new Date(y,m,1).getDay()||7, days=new Date(y,m+1,0).getDate();
    const monthStr=`${y}-${String(m+1).padStart(2,'0')}`;
    let cells='';
    for(let i=1;i<first;i++) cells+='<div class="cal-day empty"></div>';
    for(let day=1;day<=days;day++){
      const ds=`${monthStr}-${String(day).padStart(2,'0')}`;
      cells+=`<div class="cal-day ${Store.hasData(ds)?'has-data':''} ${ds===Utils.todayStr()?'today':''} ${ds===State.currentDate?'selected':''}" data-date="${ds}">${day}</div>`;
    }
    const modal=document.getElementById('calendar-modal');
    modal.innerHTML=`<div class="calendar-panel">
      <div class="cal-header"><button class="cal-nav-btn" data-nav="prev">‹</button><span class="month-label">${y}年${m+1}月</span><button class="cal-nav-btn" data-nav="next">›</button></div>
      <div class="cal-weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
      <div class="cal-grid">${cells}</div>
      <div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-sm btn-outline" style="flex:1;" data-nav="today">回到今天</button><button class="btn btn-sm btn-outline" style="flex:1;" data-nav="close">关闭</button></div>
      <div style="font-size:11px;color:var(--text-light);margin-top:8px;text-align:center;">● 有数据的日期</div></div>`;
    modal.onclick=e=>{
      const cell=e.target.closest('.cal-day:not(.empty)');
      if(cell){ State.setDate(cell.dataset.date); this.close(); return; }
      const nav=e.target.closest('[data-nav]');
      if(nav){
        const a=nav.dataset.nav;
        if(a==='prev'||a==='next'){ d.setMonth(d.getMonth()+(a==='prev'?-1:1)); this.viewDate=Utils.toDateStr(d); this.render(); }
        else if(a==='today'){ this.close(); State.setDate(Utils.todayStr()); }
        else if(a==='close') this.close();
        return;
      }
      if(e.target===modal) this.close();
    };
  }
};

/* ============================================================
   CarryPanel：手动结转的目标选择面板
   ============================================================ */
const CarryPanel = {
  st:null,
  el(){
    let m=document.getElementById('carry-modal');
    if(!m){
      m=document.createElement('div');
      m.id='carry-modal';
      document.body.appendChild(m);
    }
    return m;
  },
  open(scope,id,date){
    const item=Store.find(scope,id,date);
    if(!item){ Utils.toast('没找到这条记录'); return; }
    const type=scope.indexOf('plan:')===0?scope.slice(5):'daily';
    this.st={scope:scope,id:id,date:date,type:type,item:item,target:null};
    this.render();
    this.el().classList.add('show');
  },
  close(){ const m=document.getElementById('carry-modal'); if(m) m.classList.remove('show'); this.st=null; },
  pick(key){ if(!this.st) return; this.st.target=key; this.render(); },
  _nextDay(ds){ const x=new Date(Utils.parseDate(ds)); x.setDate(x.getDate()+1); return Utils.toDateStr(x); },
  render(){
    const st=this.st; if(!st) return;
    const m=this.el();
    const label={daily:'结转到哪一天？',weekly:'结转到哪一周？',monthly:'结转到哪一月？',yearly:'结转到哪一年？'}[st.type];
    let body='';
    if(st.item.carriedTo){
      body=`<div class="carry-note">这条已经结转到其他周期了。还原会删除目标周期里的那一条副本。</div>
        <div class="btn-row">
          <button class="btn btn-sm btn-outline" style="flex:1;" data-action="carry-close">关闭</button>
          <button class="btn btn-sm" style="flex:1;" data-action="carry-undo">还原到本期</button>
        </div>`;
    }else if(st.type==='daily'){
      const min=this._nextDay(st.date);
      body=`<div class="field"><div class="field-label">目标日期（只能选明天及以后）</div>
        <input type="date" id="carry-date" class="input input-date" min="${min}" value="${st.target||min}"></div>
        <div class="btn-row">
          <button class="btn btn-sm btn-outline" style="flex:1;" data-action="carry-close">取消</button>
          <button class="btn btn-sm" style="flex:1;" data-action="carry-do">确认结转</button>
        </div>`;
    }else{
      const opts=Carry.targets(st.scope,st.item,st.date);
      body=`<div class="carry-opts">${opts.map(o=>`<div class="carry-opt ${st.target===o.key?'active':''}" data-action="carry-pick" data-key="${o.key}">
          <span class="co-label">${o.label}</span>${o.sub?`<span class="co-sub">${o.sub}</span>`:''}
        </div>`).join('')}</div>
        <div class="btn-row">
          <button class="btn btn-sm btn-outline" style="flex:1;" data-action="carry-close">取消</button>
          <button class="btn btn-sm${st.target?'':' btn-dim'}" style="flex:1;" data-action="carry-do">确认结转</button>
        </div>`;
    }
    m.innerHTML=`<div class="carry-sheet">
      <div class="carry-title">${label}</div>
      <div class="carry-sub">${Utils.esc(st.item.text||'（未命名）')}　·　原在 ${Utils.esc(st.type==='daily'?st.date:(st.item.periodKey||''))}</div>
      ${body}
    </div>`;
    // 面板挂在 body 上，view-container 的委托收不到，这里自己处理
    m.onclick=e=>{
      if(e.target===m){ this.close(); return; }
      const a=e.target.closest('[data-action]');
      if(!a) return;
      e.preventDefault();
      const act=a.dataset.action;
      if(act==='carry-pick') this.pick(a.dataset.key);
      else if(act==='carry-do') this.confirm();
      else if(act==='carry-undo') this.undo();
      else if(act==='carry-close') this.close();
    };
  },
  confirm(){
    const st=this.st; if(!st) return;
    let key=st.target;
    if(st.type==='daily'){
      const inp=document.getElementById('carry-date');
      key=inp?inp.value:'';
      if(!key){ Utils.toast('请选择日期'); return; }
      if(key<=st.date){ Utils.toast('请选择未来日期'); return; }
    }
    if(!key){ Utils.toast('请选择目标周期'); return; }
    const ok=Carry.manual(st.scope,st.id,key,{date:st.date});
    const sc=st.scope, id=st.id, dt=st.date;
    this.close();
    if(ok) Utils.toast('已结转','撤销',()=>Carry.undo(sc,id,dt));
    else Utils.toast('结转失败');
  },
  undo(){
    const st=this.st; if(!st) return;
    const ok=Carry.undo(st.scope,st.id,st.date);
    this.close();
    Utils.toast(ok?'已还原':'还原失败');
  }
};

/* ============================================================
   init：唯一事件委托入口
   ============================================================ */
function init(){
  renderDrawer();
  State.init();
  document.getElementById('hamburger').addEventListener('click',()=>{
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawer-overlay').classList.add('show');
  });
  document.getElementById('drawer-overlay').addEventListener('click',()=>{
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawer-overlay').classList.remove('show');
  });
  document.getElementById('drawer').addEventListener('click',e=>{
    const item=e.target.closest('.drawer-item');
    if(item){
      if(item.dataset.route) State.navigate(item.dataset.route);
      else if(item.dataset.action) Actions.handle(item.dataset.action,item,e);
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer-overlay').classList.remove('show');
    }
  });
  document.getElementById('cal-btn').addEventListener('click',()=>Calendar.open());
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ Carry.run(); State.checkDayRollover(); State.render(); } });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ Calendar.close(); document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('show'); }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); Undo.undo(); }
  });

  const vc=document.getElementById('view-container');
  vc.addEventListener('click',e=>{
    const collapse=e.target.closest('[data-collapse]');
    if(collapse&&!e.target.closest('[data-action]')){ State.toggleCollapse(collapse.dataset.collapse); return; }
    const sub=e.target.closest('[data-sub]');
    if(sub){ State.bodyMindSub=sub.dataset.sub; State.render(); return; }
    const act=e.target.closest('[data-action]');
    if(act){ e.stopPropagation(); Actions.handle(act.dataset.action,act,e); return; }
  });
  vc.addEventListener('click',e=>{
    if(e.target.id==='icon-upload'||e.target.closest('#icon-upload')) return;
  });
  vc.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.sync){ Store.commit(d=>{ d.meta.sync[t.dataset.sync]=t.value; },{label:'同步设置',quiet:true,render:false}); return; }
    if(t.dataset.bd){
      const date=t.dataset.date;
      Store.commit(d=>{
        if(!d.byDate[date]) d.byDate[date]=Migrate.emptyDay();
        const bd=d.byDate[date].bodyMind.bodyData;
        bd[t.dataset.bd]=t.value; bd.updatedAt=Utils.now();
      },{label:'保存体重体脂',quiet:true,render:false});
      return;
    }
    if(t.dataset.field){ saveField(t); }
  });
  // 打字即存：不必等失去焦点（不重绘，不打断输入）
  let typingTimer=null;
  vc.addEventListener('input',e=>{
    const t=e.target;
    if(!t.dataset||!t.dataset.field) return;
    if(/^(checkbox|range|date|time|datetime-local|file)$/.test(t.type||'')) return;
    clearTimeout(typingTimer);
    typingTimer=setTimeout(()=>saveField(t),700);
  });
  // 图标上传（动态生成的节点）
  document.addEventListener('change',e=>{
    if(e.target.id==='icon-upload'){
      const file=e.target.files&&e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>compressImage(ev.target.result,512,data=>{ Store.setCustomIcon(data); Utils.toast('图标已更新 ✨'); State.render(); });
      reader.readAsDataURL(file);
    }
  });
  // 拖拽排序
  let dragging=null;
  vc.addEventListener('dragstart',e=>{
    const row=e.target.closest('[data-drag-id]'); if(!row) return;
    dragging={scope:row.dataset.dragScope,id:row.dataset.dragId,date:row.dataset.date};
    e.dataTransfer.effectAllowed='move';
  });
  vc.addEventListener('dragover',e=>{ if(dragging&&e.target.closest('[data-drag-id]')) e.preventDefault(); });
  vc.addEventListener('drop',e=>{
    const row=e.target.closest('[data-drag-id]'); if(!row||!dragging) return;
    e.preventDefault();
    if(row.dataset.dragScope===dragging.scope&&row.dataset.date===dragging.date)
      Store.move(dragging.scope,dragging.id,row.dataset.dragId,{date:dragging.date});
    dragging=null;
  });

  Router.init();
  window.addEventListener('resize',Utils.debounce(()=>Charts.flush(),250));
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

</script>
</body>
